<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recover PIN</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#EEF1E6;color:#232B22;line-height:1.5;}
  .page{max-width:560px;margin:0 auto;padding:32px 20px 64px;}
  h1{font-size:1.6rem;margin:0 0 6px;}
  p{color:#5B6656;margin:0 0 16px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px;}
  label{font-size:.9rem;color:#5B6656;}
  select,button{font:inherit;padding:9px 14px;border-radius:7px;border:1px solid #D8DECB;background:#fff;color:#232B22;}
  button{background:#35664F;color:#F5FBF6;border-color:transparent;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  #out{margin-top:20px;padding:16px;border-radius:8px;background:#fff;border:1px solid #D8DECB;font-size:1.05rem;min-height:1.5em;}
  #out.found{background:#E4F2E6;border-color:#2E7D4F;font-weight:600;}
  #out.miss{background:#FBE7E1;border-color:#B4432F;}
  .pin{font-size:1.8rem;font-weight:700;letter-spacing:.15em;}
  small{color:#8A9483;}
</style>
</head>
<body>
<div class="page">
  <h1>Recover parent PIN</h1>
  <p>This reads the PIN stored on this device and works out what it was. It only works when opened on the same site as the quiz app.</p>
  <div class="row">
    <label for="len">Try up to</label>
    <select id="len">
      <option value="4">4 digits</option>
      <option value="5">5 digits</option>
      <option value="6" selected>6 digits</option>
      <option value="8">8 digits (slower)</option>
    </select>
    <button id="go">Find PIN</button>
  </div>
  <div id="out">Ready.</div>
  <p style="margin-top:20px;"><small>Delete this file from the repo once you're back in - anyone who opens it can recover the PIN too.</small></p>
</div>
<script>
(function(){
  "use strict";
  var KEY = "quizAppParentPinHash_v1";
  var out = document.getElementById("out");
  var go = document.getElementById("go");
  var lenSel = document.getElementById("len");
  var enc = new TextEncoder();

  function simpleHash(text){
    var h = 5381;
    for (var i = 0; i < text.length; i++){
      h = (((h << 5) + h) + text.charCodeAt(i)) & 0xFFFFFFFF;
    }
    return "fb" + (h >>> 0).toString(16);
  }
  function shaHash(pin){
    return crypto.subtle.digest("SHA-256", enc.encode("quiz-app:" + pin))
      .then(function(buf){
        return Array.prototype.map.call(new Uint8Array(buf), function(b){
          return b.toString(16).padStart(2, "0");
        }).join("");
      });
  }

  function setOut(msg, cls){
    out.className = cls || "";
    out.innerHTML = msg;
  }

  go.addEventListener("click", function(){
    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e){ stored = null; }
    if (!stored){
      setOut("No saved PIN found on this site. Make sure you opened this page at your live quiz-app address (GitHub Pages), not from a downloaded file.", "miss");
      return;
    }
    var maxLen = parseInt(lenSel.value, 10);
    var useSimple = stored.slice(0, 2) === "fb"; // fallback hash was used on this device
    go.disabled = true;
    setOut("Searching...");

    var minLen = 4;
    var L = minLen;
    var n = 0;
    var max = Math.pow(10, L);

    function pad(num, width){
      var s = String(num);
      while (s.length < width) s = "0" + s;
      return s;
    }

    function finish(pin){
      go.disabled = false;
      if (pin === null){
        setOut("No numeric PIN of " + minLen + " to " + maxLen + " digits matched. It may be longer, or contain letters. Try a higher length, or ask for a widened search.", "miss");
      } else {
        setOut("Your PIN is<br><span class='pin'>" + pin + "</span>", "found");
      }
    }

    function step(){
      var budget = 2000; // check this many per frame, then yield so the page stays responsive
      function chunk(){
        var checked = 0;
        while (checked < budget){
          if (n >= max){
            L++;
            if (L > maxLen){ finish(null); return; }
            n = 0;
            max = Math.pow(10, L);
          }
          var pin = pad(n, L);
          n++;
          checked++;
          if (useSimple){
            if (simpleHash("quiz-app:" + pin) === stored){ finish(pin); return; }
          } else {
            // async SHA path handled separately below
          }
        }
        setOut("Searching... (" + L + " digits)");
        setTimeout(chunk, 0);
      }

      function chunkAsync(){
        var jobs = [];
        var checked = 0;
        var startN = n, startL = L;
        while (checked < budget){
          if (n >= max){
            L++;
            if (L > maxLen){ break; }
            n = 0;
            max = Math.pow(10, L);
          }
          jobs.push([pad(n, L), n]);
          n++;
          checked++;
        }
        if (jobs.length === 0){ finish(null); return; }
        Promise.all(jobs.map(function(j){
          return shaHash(j[0]).then(function(h){ return h === stored ? j[0] : null; });
        })).then(function(results){
          for (var i = 0; i < results.length; i++){
            if (results[i]){ finish(results[i]); return; }
          }
          if (L > maxLen){ finish(null); return; }
          setOut("Searching... (" + L + " digits)");
          setTimeout(chunkAsync, 0);
        });
      }

      if (useSimple) chunk(); else chunkAsync();
    }

    step();
  });
})();
</script>
</body>
</html>
